import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'application'
}

group 'com.toxicrain'
version 'Dev-4'

sourceCompatibility = JavaVersion.VERSION_1_8

ext {
    lwjglVersion = '3.4.1'
    jomlVersion  = '1.10.1'
    imguiVersion = '1.86.11'
    luajVersion  = '3.0.1'
}

// Platform detection
def os   = OperatingSystem.current()
def arch = System.getProperty("os.arch").toLowerCase()

ext {
    // LWJGL natives
    lwjglNatives =
            os.isWindows() ? 'natives-windows' :
                    os.isMacOsX()  ? 'natives-macos'   :
                            os.isLinux() && arch.contains('arm') ? 'natives-linux-arm64' :
                                    os.isLinux()  ? 'natives-linux' :
                                            null

    // JavaWindowManager classifier
    jwmClassifier =
            os.isWindows() ? 'windows' :
                    os.isMacOsX()  ? 'macos'   :
                            os.isLinux()   ? 'linux'   :
                                    null
}

if (!lwjglNatives || !jwmClassifier) {
    throw new GradleException("Unsupported platform: OS=${os}, ARCH=${arch}")
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

tasks.register('generateJavadoc', Javadoc) {
    description = 'Generates Javadoc API documentation'
    group = 'Documentation'

    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDir = file("$buildDir/docs/javadoc")

    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        links 'https://docs.oracle.com/javase/8/docs/api/'
        memberLevel = JavadocMemberLevel.PUBLIC
    }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation 'org.lwjgl:lwjgl'
    implementation 'org.lwjgl:lwjgl-assimp'
    implementation 'org.lwjgl:lwjgl-glfw'
    implementation 'org.lwjgl:lwjgl-openal'
    implementation 'org.lwjgl:lwjgl-opengl'
    implementation 'org.lwjgl:lwjgl-stb'

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"

    implementation "org.joml:joml:$jomlVersion"

    // JSON
    implementation 'org.json:json:20231013'

    // ImGui
    implementation "io.github.spair:imgui-java-binding:$imguiVersion"
    implementation "io.github.spair:imgui-java-lwjgl3:$imguiVersion"
    implementation "io.github.spair:imgui-java-$lwjglNatives:$imguiVersion"
    implementation "io.github.spair:imgui-java-app:$imguiVersion"

    // Lua
    implementation "org.luaj:luaj-jse:$luajVersion"

    // Logging
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'ch.qos.logback:logback-classic:1.5.16'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.28'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'

    // JavaWindowManager
    implementation "com.github.strubium:JavaWindowManager:1.0.7:$jwmClassifier"

    implementation 'com.github.strubium:SmeagleBus:1.0.1'
    implementation 'com.github.ToxicRainStudios:Instanceable:1.0.0'

    implementation "io.reactivex.rxjava3:rxjava:3.1.10"
}

application {
    mainClass = 'com.toxicrain.rainengine.Application'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}